services:
  - type: web
    name: health-risk-dashboard-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_render.py
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_POOL_SIZE
        value: 2
      - key: DATABASE_MAX_OVERFLOW
        value: 1
      - key: DATABASE_POOL_TIMEOUT
        value: 15
      - key: DATABASE_POOL_RECYCLE_SECONDS
        value: 300
      - key: REDIS_URL
        sync: false
      - key: REQUIRE_REDIS
        value: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: https://aihealthcaredashboard.vercel.app
      - key: FRONTEND_URL
        value: https://aihealthcaredashboard.vercel.app
      - key: ALLOWED_HOSTS
        sync: false
      - key: FORCE_HTTPS
        value: true
      - key: PUBLIC_API_DOCS
        value: false
      - key: RUN_STARTUP_SCHEMA_CHECK
        value: false
      - key: REQUIRE_ML_MODEL
        value: true
      - key: ML_ARTIFACT_DIR
        value: artifacts/ml
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_REQUESTS
        value: 120
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: AUTH_RATE_LIMIT_REQUESTS
        value: 20
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: TRUSTED_PROXY_COUNT
        value: 1
      - key: AI_ENABLED
        value: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: AI_MEMORY_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: WITHINGS_CLIENT_ID
        sync: false
      - key: WITHINGS_CLIENT_SECRET
        sync: false
      - key: WITHINGS_REDIRECT_URI
        sync: false
      - key: WITHINGS_WEBHOOK_URL
        sync: false
      - key: WITHINGS_WEBHOOK_SECRET
        sync: false
      - key: REQUIRE_WITHINGS
        value: false
      - key: SENTRY_DSN
        sync: false
      - key: REQUIRE_SENTRY
        value: false
      - key: RELEASE
        sync: false
