name: health-risk-dashboard-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthrisk_test
      POSTGRES_USER: healthrisk_test
      POSTGRES_PASSWORD: healthrisk_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthrisk_test -d healthrisk_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
